[pytest]
pythonpath = .
testpaths = tests
markers =
    slow: ejecuta inferencia ML real (TensorFlow / scikit-learn). Lenta, requiere los artefactos entrenados en models/.
    live: prueba de extremo a extremo contra los artefactos reales del proyecto (modelos y reportes).
addopts = -ra --strict-markers
filterwarnings =
    ignore:.*protected namespace.*:UserWarning

[coverage:run]
source = backend
